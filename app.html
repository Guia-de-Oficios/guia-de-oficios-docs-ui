<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guía de Oficios — Navegador Completo Stitch (10 Pantallas Intactas)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Barra Superior de Control para Navegar las 10 Pantallas Originales de Stitch -->
  <header class="bg-slate-950 border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-50">
    <div class="flex items-center gap-2.5">
      <span class="px-2.5 py-1 rounded-lg bg-blue-600 text-white text-xs font-bold">STITCH UI 100% ORIGINAL</span>
      <h1 class="text-sm md:text-base font-bold">Guía de Oficios — Flujo Interactivo Completo (10 Pantallas)</h1>
    </div>

    <div class="flex flex-wrap gap-1.5" id="screen-tabs">
      <!-- Populated by JS -->
    </div>
  </header>

  <!-- Contenedor Principal con Iframe apuntando al code.html exacto de cada pantalla sin tocar una sola línea de su diseño -->
  <div class="flex-1 flex flex-col lg:flex-row items-start justify-center gap-6 p-4 max-w-7xl mx-auto w-full">
    
    <!-- Visor de Pantalla Stitch Exacta -->
    <div class="w-full lg:w-[440px] shrink-0 flex flex-col items-center">
      <div class="w-full bg-white rounded-3xl overflow-hidden shadow-2xl border-4 border-slate-800">
        <iframe
          id="stitch-frame"
          src="bienvenida_y_selecci_n_de_rol/code.html"
          class="w-full h-[860px] border-0"
          title="Vista Stitch Original"
        ></iframe>
      </div>
    </div>

    <!-- Panel de Estado Funcional y Conexión Backend Go -->
    <div class="flex-1 w-full space-y-4">
      <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-5">
        <div class="flex items-center justify-between">
          <span id="current-step-badge" class="text-xs font-bold uppercase tracking-wider text-emerald-400">Pantalla 1 de 10</span>
          <div class="flex gap-2">
            <button onclick="prevScreen()" class="px-3 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-semibold">← Anterior</button>
            <button onclick="nextScreen()" class="px-3 py-1 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold">Siguiente →</button>
          </div>
        </div>
        <h2 id="current-screen-title" class="text-xl font-bold mt-2">1. Bienvenida y Selección de Rol</h2>
        <p id="current-screen-folder" class="text-xs font-mono text-slate-400 mt-0.5">Carpeta: bienvenida_y_selecci_n_de_rol/code.html</p>
        <p id="current-screen-desc" class="text-sm text-slate-300 mt-3 leading-relaxed"></p>

        <div class="mt-4 pt-4 border-t border-slate-700">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">🔗 Endpoint Golang / Funcionalidad Conectada:</h3>
          <pre id="current-screen-api" class="text-xs font-mono bg-slate-950 text-emerald-300 p-3.5 rounded-xl overflow-x-auto"></pre>
        </div>
      </div>
    </div>

  </div>

  <script>
    const screens = [
      {
        id: "bienvenida",
        label: "1. Bienvenida y Rol",
        folder: "bienvenida_y_selecci_n_de_rol/code.html",
        desc: "Permite elegir entre 'Necesito un oficio para mi casa' (Cliente) u 'Ofrezco mis servicios de oficio' (Profesional), o ir a Iniciar Sesión.",
        api: "GET /api/v1/auth/me?role=client\n-> Redirige a Registro o Inicio según el rol elegido."
      },
      {
        id: "registro",
        label: "2. Registro (Google / Manual)",
        folder: "registro_google_o_manual/code.html",
        desc: "Botón rápido 'Continuar con Google' o carga manual de Nombre y Apellido, Teléfono con prefijo WhatsApp, Email y Contraseña con visor de mostrar/ocultar.",
        api: "POST /api/v1/auth/register\nBody: { full_name, phone, email, password, role, auth_provider }"
      },
      {
        id: "inicio_cliente",
        label: "3. Inicio y Categorías",
        folder: "cliente_inicio_y_categor_as/code.html",
        desc: "Saludo '¡Hola, María!' (Vecina activa), dirección 'Av. Rivadavia 5420, Caballito', buscador, tarjeta de ayuda '¿No sabés qué profesional necesitás?' y grilla de 8 oficios.",
        api: "GET /api/v1/categories\nPOST /api/v1/diagnostic { \"problem\": \"Pierde agua la canilla\" }"
      },
      {
        id: "resultados",
        label: "4. Resultados (Plomeros)",
        folder: "cliente_resultados_de_profesionales/code.html",
        desc: "Chips de filtro (Todos, Urgencias hoy, Matriculados, Mejor valorados), tarjetas de Roberto Carlos Gómez ($12.000) y Martín Edgardo Silva ($10.000) y tarjeta de asistencia telefónica barrial.",
        api: "GET /api/v1/professionals?category_id=1&only_urgent=true&only_licensed=true"
      },
      {
        id: "perfil_pro",
        label: "5. Perfil de Roberto",
        folder: "cliente_perfil_del_profesional_y_contacto/code.html",
        desc: "Ficha completa de Roberto Carlos Gómez: DNI Verificado, Matrícula N° 48.912, Urgencias hoy, presentación (+25 años, 100% garantía), visita $12.000, fotos reales de trabajos, opinión de Graciela M. y barra fija inferior con WhatsApp y Llamada.",
        api: "GET /api/v1/professionals/aaaa1111-1111-1111-1111-111111111111"
      },
      {
        id: "solicitud_guiada",
        label: "6. Solicitud Guiada",
        folder: "cliente_solicitud_guiada_a_roberto/code.html",
        desc: "Paso 1 de 2: Selección de urgencia (Normal / Urgente hoy), descripción del problema con chips de texto rápido ('+ Gotea la canilla', '+ No sube agua al tanque', '+ Pérdida en el inodoro') y carga de foto ('Foto_caño_cocina.jpg').",
        api: "POST /api/v1/requests\nBody: { professional_id, urgency, problem_description, photo_url }"
      },
      {
        id: "confirmacion",
        label: "7. Confirmación y Contacto",
        folder: "cliente_elegir_contacto_y_confirmaci_n/code.html",
        desc: "Confirmación '¡Listo! Registramos tu solicitud para Roberto Gómez', resumen del pedido y botones directos de 64px para abrir WhatsApp con mensaje pre-armado o Llamar por teléfono.",
        api: "GET /api/v1/requests/{id}\n-> Dispara Intent Android a https://wa.me/ o tel:"
      },
      {
        id: "calificacion",
        label: "8. Trabajo Terminado y Calificación",
        folder: "cliente_trabajo_terminado_y_calificaci_n/code.html",
        desc: "Puntuación de 1 a 5 estrellas grandes (48px), 5 botones destacables (Puntualidad, Precio justo, Honestidad y prolijidad, Excelente atención, Solución en el acto) y comentario vecinal.",
        api: "POST /api/v1/requests/{id}/reviews\nBody: { rating: 5, highlights: [...], comment: \"...\" }"
      },
      {
        id: "pro_dni",
        label: "9. Profesional: Registro y DNI",
        folder: "profesional_registro_y_verificaci_n_dni/code.html",
        desc: "Paso 2 de 3 (66%): Selección de oficio principal, especialidades secundarias ('Destapaciones', 'Calefones y Termotanques'), zona de trabajo (5 km), foto frente y dorso de DNI obligatoria y matrícula opcional.",
        api: "POST /api/v1/professionals/{id}/verification\nBody: { primary_category_id, specialties, dni_front_url, dni_back_url, license_number }"
      },
      {
        id: "pro_panel",
        label: "10. Profesional: Panel y Solicitudes",
        folder: "profesional_panel_y_solicitudes_recibidas/code.html",
        desc: "Control de disponibilidad en tiempo real ('Estás DISPONIBLE' / 'Pausar disponibilidad'), Bento Grid (4.9 ★, 3 Nuevas hoy, 18 Contactos este mes) y tarjetas de pedidos de María Elena Castro (URGENTE) y Jorge Benítez.",
        api: "GET /api/v1/professionals/{id}/dashboard\nPATCH /api/v1/professionals/{id}/availability { \"is_available_now\": true }"
      }
    ];

    let currentIndex = 0;

    function renderTabs() {
      const container = document.getElementById('screen-tabs');
      container.innerHTML = screens.map((s, idx) => `
        <button
          onclick="selectScreen(${idx})"
          class="px-2.5 py-1.5 rounded-lg text-xs font-semibold transition ${
            idx === currentIndex
              ? 'bg-blue-600 text-white shadow'
              : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
          }"
        >
          ${s.label}
        </button>
      `).join('');
    }

    function selectScreen(index) {
      currentIndex = index;
      const s = screens[currentIndex];
      const frame = document.getElementById('stitch-frame');
      frame.src = s.folder;

      document.getElementById('current-step-badge').textContent = `Pantalla ${currentIndex + 1} de ${screens.length}`;
      document.getElementById('current-screen-title').textContent = s.label;
      document.getElementById('current-screen-folder').textContent = `Archivo Stitch intacto: ui-stitch/${s.folder}`;
      document.getElementById('current-screen-desc').textContent = s.desc;
      document.getElementById('current-screen-api').textContent = s.api;
      renderTabs();
    }

    function prevScreen() {
      selectScreen((currentIndex - 1 + screens.length) % screens.length);
    }

    function nextScreen() {
      selectScreen((currentIndex + 1) % screens.length);
    }

    // Intercept links inside the Stitch iframe so clicking buttons advances naturally in the flow
    document.getElementById('stitch-frame').addEventListener('load', function() {
      try {
        const doc = this.contentDocument || this.contentWindow.document;
        if (!doc) return;

        // Wire up navigation transitions without altering a single pixel of the Stitch DOM/CSS
        if (currentIndex === 0) {
          const btnStart = doc.getElementById('btn-start');
          if (btnStart) {
            btnStart.addEventListener('click', () => {
              const isClient = doc.getElementById('role-client')?.checked;
              setTimeout(() => selectScreen(isClient ? 2 : 8), 500);
            });
          }
        } else if (currentIndex === 2) {
          // Clicking any category card goes to Search Results (Screen 4)
          doc.querySelectorAll('article').forEach(art => {
            art.addEventListener('click', () => selectScreen(3));
          });
        } else if (currentIndex === 3) {
          // Clicking "Ver perfil y disponibilidad" goes to Roberto's Profile (Screen 5)
          doc.querySelectorAll('article a').forEach(a => {
            a.addEventListener('click', (e) => {
              e.preventDefault();
              selectScreen(4);
            });
          });
          // Back button goes to Home (Screen 3)
          const backBtn = doc.querySelector('header button');
          if (backBtn) backBtn.addEventListener('click', () => selectScreen(2));
        } else if (currentIndex === 4) {
          // Clicking WhatsApp or Call on Roberto's Profile opens Guided Request (Screen 6)
          doc.querySelectorAll('.fixed.bottom-0 a').forEach(a => {
            a.addEventListener('click', (e) => {
              e.preventDefault();
              selectScreen(5);
            });
          });
          const backLink = doc.querySelector('header a');
          if (backLink) backLink.addEventListener('click', (e) => { e.preventDefault(); selectScreen(3); });
        }
      } catch (err) {
        // Ignore cross-origin if opened via file://
      }
    });

    selectScreen(0);
  </script>
</body>
</html>
